<!DOCTYPE html>
<html>
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

<body>
<div class="screen">

  <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600;color:#e6f3ee;">
    <span>9:41</span><span style="font-size:12px;">5G</span>
  </div>
  <div style="padding:8px 24px 14px;flex:none;display:flex;align-items:center;justify-content:space-between;">

  <div style="flex:1;overflow-y:auto;padding:8px 24px 20px;">

      <p style="font-size:14px;line-height:1.6;color:#bcd6ce;margin:13px 0 22px;">A simple verification protects the family from anyone pretending to be a trusted contact.</p>
      <div style="display:flex;flex-direction:column;gap:11px;">
        <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;"><div style="width:26px;height:26px;border-radius:50%;background:#1f8a5b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div><span style="font-size:13.5px;">Identity confirmed — Imran Rahman</span></div>
        <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;"><div style="width:26px;height:26px;border-radius:50%;background:#1f8a5b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div><span style="font-size:13.5px;">Phone number verified · +60 12-345 6789</span></div>
        <div style="display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;"><div style="width:26px;height:26px;border-radius:50%;background:#1f8a5b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">✓</div><span style="font-size:13.5px;">Relationship confirmed by backup contact</span></div>
      </div>
    </div>
  </div>

  <div style="flex:none;padding:14px 24px 26px;border-top:1px solid rgba(255,255,255,.08);">
    <div style="width:100%;border:0;background:#e7c163;color:#13352e;font-size:16px;font-weight:700;padding:16px;border-radius:15px;text-align:center;">Continue</div>
  </div>
</div>
