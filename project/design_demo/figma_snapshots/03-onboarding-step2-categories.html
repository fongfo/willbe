<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#eceae3;display:flex;justify-content:center;padding:40px 0;}
.screen{width:392px;min-height:844px;background:#f3f6f4;border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(12,33,29,.18);}

.chip-on{background:#dcefe9;border:1.5px solid #0f766e;color:#0b5d56;}

<body>
<div class="screen">

  <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:600;color:#13352e;position:relative;z-index:5;">
    <span>9:41</span>
    <div style="position:absolute;left:50%;top:9px;transform:translateX(-50%);width:104px;height:26px;background:#0c211d;border-radius:0 0 16px 16px;"></div>
    <div style="display:flex;align-items:center;gap:6px;">

    </div>
  </div>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;">
    <div style="padding:6px 24px 16px;flex:none;">

    <div style="flex:1;overflow-y:auto;padding:4px 24px 24px;">
      <h2 style="font-family:Newsreader,serif;font-weight:500;font-size:28px;line-height:1.18;margin:8px 0 0;color:#13352e;">What would your family need to find?</h2>

      <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;">

        <span class="chip chip-on">EPF / KWSP <span style="margin-left:7px;font-weight:700;">✓</span></span>
        <span class="chip chip-on">Takaful <span style="margin-left:7px;font-weight:700;">✓</span></span>
        <span class="chip chip-off">Investments</span>
        <span class="chip chip-on">Property <span style="margin-left:7px;font-weight:700;">✓</span></span>
        <span class="chip chip-off">Crypto</span>
        <span class="chip chip-off">Overseas</span>

      <div style="width:100%;border:0;background:#0f766e;color:#fff;font-size:16px;font-weight:700;padding:16px;border-radius:15px;box-shadow:0 10px 20px rgba(15,118,110,.22);text-align:center;">Continue</div>
