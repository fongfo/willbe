name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: willbe
          POSTGRES_PASSWORD: willbe_dev
          POSTGRES_DB: willbe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://willbe:willbe_dev@localhost:5432/willbe?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test -- --ci

  anchoring:
    name: Anchoring service (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/anchoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/anchoring/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  contracts:
    name: Proof of Plan contracts (compile, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/anchoring/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/anchoring/contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run typecheck
      - run: npm test

  app:
    name: App (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high --prefix backend || true
      - run: npm audit --audit-level=high --prefix services/anchoring || true
      - run: npm audit --audit-level=high --prefix services/anchoring/contracts || true
      - run: npm audit --audit-level=high --prefix app || true
